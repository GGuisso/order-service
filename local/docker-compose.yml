services:
  mongodb:
    image: mongo
    ports:
      - 27017:27017
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=123

  rabbitmq:
    image: rabbitmq:3.9.29-management
    ports:
      - 15672:15672
      - 5672:5672
      
  redis:
    image: redis
    restart: always
    ports:
      - 6379:6379
    command: redis-server --loglevel warning